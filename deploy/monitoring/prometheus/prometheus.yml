# sun_life Prometheus 配置（阶段 3-1 监控体系）
global:
  # 压测时需要较细的粒度看拐点；生产可放宽到 30s
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 应用：Docker DNS 把服务名 app 解析为所有副本 IP，扩缩容后 15s 内自动发现
  - job_name: hmdp-app
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    dns_sd_configs:
      - names: [app]
        type: A
        port: 9081
        refresh_interval: 15s

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  # 仅在 --profile resources 时存在；不存在时该 target 显示 down，不影响其他抓取
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
