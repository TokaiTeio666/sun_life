# ========== sun_life 一键启动编排 ==========
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 带监控（Prometheus + Grafana + exporter）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.monitoring.yml up -d --build
# 环境变量可放在 deploy/.env 中覆盖（端口映射、密码等）

services:
  # ---------- PostgreSQL 16（首次启动自动导入 hmdp.sql 并建表） ----------
  postgres:
    restart: unless-stopped
    image: postgres:16.4
    container_name: hmdp-postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      POSTGRES_DB: hmdp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
      # 慢查询日志（容量基线与瓶颈定位用）：超过 200ms 的语句写入日志
      - -c
      - log_min_duration_statement=200
      # 语句级统计：postgres-exporter 的 stat_statements 采集器读取（hmdp.sql 里 CREATE EXTENSION）
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # 容量参数：压测 / 生产按机器规格调大（见 deploy/bench.env.example）
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次启动自动建表导数据（仅数据目录为空时执行）
      - ../src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/hmdp.sql:ro
    healthcheck:
      # 走 TCP：initdb 导入 hmdp.sql 期间的临时实例只监听 unix socket，导入完成前不会误报就绪
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hmdp"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- Redis 7 ----------
  redis:
    restart: unless-stopped
    image: redis:7.2
    container_name: hmdp-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------- Kafka（KRaft 单节点，无需额外协调组件） ----------
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.7.0
    container_name: hmdp-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 两个监听器：PLAINTEXT 给 compose 网络内的客户端（地址 kafka:9092）；
      # EXTERNAL 给网络外的客户端（宿主机上的进程、分机部署时其他机器上的 app），
      # 对外地址由 KAFKA_EXTERNAL_HOST 指定，必须是客户端能访问到的 IP / 域名
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- 应用（Spring Boot + Kafka 异步秒杀） ----------
  # 无状态、可水平扩展：docker compose -f deploy/docker-compose.yml up -d --scale app=3
  # 不设 container_name、不直接映射宿主端口（多副本会冲突），统一由 gateway(nginx) 负载均衡对外暴露 8081
  app:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "8081"
      # 管理端口（/actuator/prometheus）：只在容器网络内供 Prometheus 抓取，网关不代理
      - "9081"
    environment:
      # 覆盖 application.yaml 中 127.0.0.1 的配置，默认连同一编排里的容器；
      # 分机部署时用 APP_PG_ADDR / APP_REDIS_HOST / APP_REDIS_PORT / APP_KAFKA_BOOTSTRAP 指向其他机器
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${APP_PG_ADDR:-postgres:5432}/hmdp?reWriteBatchedInserts=true"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-123456}"
      SPRING_DATA_REDIS_HOST: "${APP_REDIS_HOST:-redis}"
      SPRING_DATA_REDIS_PORT: "${APP_REDIS_PORT:-6379}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${APP_KAFKA_BOOTSTRAP:-kafka:9092}"
      # 压测开关：false 时商铺详情直查 PostgreSQL（用于缓存 A/B 对比）
      HMDP_CACHE_ENABLED: "${HMDP_CACHE_ENABLED:-true}"
      # 商铺布隆过滤器的设计容量（店铺数上限）；改动后启动时自动换新位图并重新预热
      BLOOM_EXPECTED_INSERTIONS: "${BLOOM_EXPECTED_INSERTIONS:-1000000}"
      # 图片写共享卷，任意副本上传、nginx 直接对外提供
      HMDP_UPLOAD_DIR: "/data/upload"
      # 每个副本的 DB 连接池上限；副本数 × 该值需小于 PostgreSQL max_connections
      DB_POOL_MAX: "${DB_POOL_MAX:-30}"
      # 过载保护：等 DB 连接的超时（毫秒）；回源 DB 并发闸许可数（-1 = 连接池 × 2，0 = 关闭）
      DB_CONN_TIMEOUT_MS: "${DB_CONN_TIMEOUT_MS:-800}"
      DB_GATE_PERMITS: "${DB_GATE_PERMITS:--1}"
      # 关注 Feed：false 回到发帖时同步推送；粉丝数超过阈值的作者不推送、改为读取时拉取
      FEED_ASYNC_PUSH: "${FEED_ASYNC_PUSH:-true}"
      FEED_BIGV_THRESHOLD: "${FEED_BIGV_THRESHOLD:-5000}"
      # 登录态本地短缓存秒数；0 = 关闭（每个带 token 的请求一次 HGETALL）
      LOGIN_LOCAL_CACHE_SECONDS: "${LOGIN_LOCAL_CACHE_SECONDS:-15}"
      # 多级缓存的本地一级（店铺详情 / 商铺类型 / 热门笔记）；false = 只用 Redis
      LOCAL_CACHE_ENABLED: "${LOCAL_CACHE_ENABLED:-true}"
      # 秒杀售罄本地标记；false = 售罄后每个请求仍执行 Lua
      SECKILL_SOLDOUT_FLAG: "${SECKILL_SOLDOUT_FLAG:-true}"
      # 订单号生成：local = 本地发号；redis = 每个订单号一次 Redis INCR
      ORDER_ID_MODE: "${ORDER_ID_MODE:-local}"
      # 点赞数异步回写；false = 每次点赞更新一次 tb_blog
      LIKE_ASYNC_FLUSH: "${LIKE_ASYNC_FLUSH:-true}"
      # 笔记列表（热门 / Feed）是否返回正文；true = 改造前
      BLOG_LIST_CONTENT: "${BLOG_LIST_CONTENT:-false}"
      # Feed 笔记摘要缓存的 Redis 秒数；0 = 关闭（每次查 tb_blog + tb_user）
      BLOG_SUMMARY_CACHE_SECONDS: "${BLOG_SUMMARY_CACHE_SECONDS:-60}"
      # 「我关注的大 V」本地缓存秒数；0 = 关闭（每次读 Feed 多一次 SINTER）
      FEED_BIGV_LOCAL_CACHE_SECONDS: "${FEED_BIGV_LOCAL_CACHE_SECONDS:-5}"
      # 默认是 4G 内存机器的保守值；压测 / 生产用 APP_JAVA_OPTS 调大堆
      JAVA_OPTS: "${APP_JAVA_OPTS:--Xms256m -Xmx512m -Dfile.encoding=UTF-8}"
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/data/upload/blogs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------- 前端 + 网关（静态页、/api 反向代理、后端负载均衡与限流） ----------
  # 8080：前端页面（/api 前缀转发到后端）；8081：后端 API 直连入口（压测/Postman 用，同样负载均衡）
  # 扩缩容 app 后需执行：docker compose -f deploy/docker-compose.yml restart frontend（重新解析副本 IP）
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    container_name: hmdp-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${APP_PORT:-8081}:8081"
    volumes:
      - upload-data:/usr/share/nginx/upload/imgs/blogs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
    name: hmdp-pg16-data
  redis-data:
    name: hmdp-redis-data
  kafka-data:
    name: hmdp-kafka-data
  upload-data:
    name: hmdp-upload-data
