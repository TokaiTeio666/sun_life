# ========== sun_life 一键启动编排 ==========
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 环境变量可放在 deploy/.env 中覆盖（端口映射、密码等）

services:
  # ---------- MySQL 8（首次启动自动导入 hmdp.sql 并建库） ----------
  mysql:
    restart: unless-stopped
    image: mysql:8.0
    container_name: hmdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 课程 hmdp.sql 使用 DEFAULT '0000-00-00 00:00:00'，需关闭严格模式才能导入
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表导数据（幂等：表存在则跳过）
      - ../src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/hmdp.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- Redis 7 ----------
  redis:
    restart: unless-stopped
    image: redis:7.2
    container_name: hmdp-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------- Kafka（KRaft 单节点，无需额外协调组件） ----------
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.7.0
    container_name: hmdp-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- 应用（Spring Boot + Kafka 异步秒杀） ----------
  app:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hmdp-app
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      # 覆盖 application.yaml 中 127.0.0.1 的配置，改为容器服务名
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # 压测开关：false 时商铺详情直查 MySQL（用于缓存 A/B 对比）
      HMDP_CACHE_ENABLED: "${HMDP_CACHE_ENABLED:-true}"
      # 云服务器低内存场景限制堆大小（4G 内存机器推荐值）
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------- 前端（黑马点评静态页 + /api 反向代理） ----------
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    container_name: hmdp-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql-data:
    name: hmdp-mysql8-data
  redis-data:
    name: hmdp-redis-data
  kafka-data:
    name: hmdp-kafka-data
