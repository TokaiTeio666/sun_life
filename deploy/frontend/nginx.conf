# sun_life 前端 + 网关 nginx 配置（容器内，conf.d/default.conf）

# 后端集群：app 服务名由 Docker DNS 解析为所有副本 IP，nginx 默认轮询
# keepalive：复用到后端的长连接，避免每个请求新建 TCP 连接
upstream hmdp_app {
    server app:8081 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 限流：秒杀接口按客户端 IP 每秒 20 个请求（突发 40），超出直接 503，保护 Redis/Kafka
# 注意：压测机单 IP 发起大量请求时会被限流，压测走 8081 入口（不限流）
limit_req_zone $binary_remote_addr zone=seckill_ip:10m rate=20r/s;
limit_req_status 429;

# 压缩：JSON 与静态资源
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
gzip_vary on;

# 前端页面入口（宿主机 8080）
server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 笔记图片：先找镜像内置的示例图片，找不到再到共享上传卷（app 各副本写入）中找
    location ^~ /imgs/blogs/ {
        expires 7d;
        access_log off;
        try_files $uri @uploaded;
    }
    location @uploaded {
        root /usr/share/nginx/upload;
        expires 7d;
        access_log off;
    }

    # 静态资源长缓存（图片/脚本/样式），减少重复请求
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 秒杀接口单独限流
    location /api/voucher-order/seckill/ {
        limit_req zone=seckill_ip burst=40 nodelay;
        rewrite /api(/.*) $1 break;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # API 反向代理：前端请求 /api/xxx -> 后端 /xxx（去掉 /api 前缀）
    location /api {
        default_type application/json;
        rewrite /api(/.*) $1 break;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 后端 API 直连入口（宿主机 8081）：与原先直接访问 app:8081 的路径一致，供压测 / Postman 使用
server {
    listen 8081;
    server_name localhost;

    location / {
        include /etc/nginx/conf.d/proxy_common.inc;
    }
}
