server:
  port: 8081
  tomcat:
    # 线程数要与下游连接池匹配：200 个线程抢 10 个 DB 连接只会在池上排队
    threads:
      max: 200
      min-spare: 20
    accept-count: 500
    max-connections: 8192
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements：saveBatch 真正合并成多值 INSERT（秒杀批量落库依赖）
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      # 经验值：连接数 ≈ CPU 核数 × 2 + 有效磁盘数；多实例时注意 实例数 × 该值 < MySQL max_connections
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 2000ms
          time-between-eviction-runs: 10s
      timeout: 2000ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      properties:
        enable.idempotence: true
        linger.ms: 5
        buffer.memory: 33554432
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: seckill-order-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      properties:
        # 批量消费：单批处理耗时上限，超过会被踢出消费组触发 rebalance
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual_immediate
      concurrency: 3
# 业务自定义配置
hmdp:
  # 图片上传根目录：多实例部署时必须是共享存储（docker volume / NFS），或替换为 OSS 实现
  upload:
    dir: ${HMDP_UPLOAD_DIR:./upload}
  # 压测开关：false 时商铺详情跳过布隆过滤器与缓存，直接查库（用于 A/B 对比）
  cache:
    enabled: true
  kafka:
    # 秒杀主题分区数（只能增不能减）；整个消费组的最大并行度 = 分区数
    seckill-partitions: 12
    consumer:
      concurrency: 3
  order:
    # 未支付订单超时时长与扫描间隔（Kafka 无延迟消息，改用本地定时任务）
    timeout-minutes: 30
    timeout-scan-ms: 60000
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    # 生产/压测用 info；本地调试用 --spring.profiles.active=dev 打开 debug（含 SQL 与验证码日志）
    com.hmdp: info
