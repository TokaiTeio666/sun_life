server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ NameServer 地址
  producer:
    group: seckill-order-producer # 生产者组
# 业务自定义配置
hmdp:
  order:
    # 订单超时未支付自动关单的延迟等级（RocketMQ 延迟消息，1~18 级）
    # 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
    # 16 = 30 分钟（生产默认）；学习测试时可改小：4 = 30 秒，5 = 1 分钟
    timeout-delay-level: 16
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
