server:
  port: 8081
  tomcat:
    # 线程数要与下游连接池匹配：200 个线程抢 10 个 DB 连接只会在池上排队
    # （仅在 hmdp.web.virtual-threads=false 时生效）
    threads:
      max: 200
      min-spare: 20
    accept-count: 500
    max-connections: 8192
    # 暴露 tomcat.threads.busy 等 MBean 指标（容量评估需要看繁忙线程数）
    mbeanregistry:
      enabled: true
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements：saveBatch 真正合并成多值 INSERT（秒杀批量落库依赖）
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      # 经验值：连接数 ≈ CPU 核数 × 2 + 有效磁盘数；多实例时注意 实例数 × 该值 < MySQL max_connections
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 10
      # 等连接的最长时间。过载时与其让请求排 3s 再失败，不如 800ms 就返回 503（见 WebExceptionAdvice）；
      # Hikari 允许的最小值是 250。Kafka 消费者和定时任务也用这个池，超时后由各自的重试机制处理
      connection-timeout: ${DB_CONN_TIMEOUT_MS:800}
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 2000ms
          time-between-eviction-runs: 10s
      timeout: 2000ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      properties:
        enable.idempotence: true
        linger.ms: 5
        buffer.memory: 33554432
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: seckill-order-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      properties:
        # 批量消费：单批处理耗时上限，超过会被踢出消费组触发 rebalance
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual_immediate
      concurrency: 3
# 业务自定义配置
hmdp:
  web:
    # JDK 21 虚拟线程：Tomcat 每个请求一个虚拟线程（只切换请求线程，Kafka 消费者与定时任务仍用平台线程，
    # 原因见 VirtualThreadConfig）。开启后并发上限由下游连接池决定。回退 / A/B 对比：VIRTUAL_THREADS=false
    virtual-threads: ${VIRTUAL_THREADS:true}
  # 过载保护：回源 DB 的并发闸（见 DbGate）。同时在查库 / 等连接的请求数超过许可数时立即返回 503。
  # 负数 = 连接池大小 × 2；0 = 关闭；正数 = 指定许可数
  db-gate:
    permits: ${DB_GATE_PERMITS:-1}
  # 图片上传根目录：多实例部署时必须是共享存储（docker volume / NFS），或替换为 OSS 实现
  upload:
    dir: ${HMDP_UPLOAD_DIR:./upload}
  # 压测开关：false 时商铺详情跳过布隆过滤器与缓存，直接查库（用于 A/B 对比）
  cache:
    enabled: true
  kafka:
    # 秒杀主题分区数（只能增不能减）；整个消费组的最大并行度 = 分区数
    seckill-partitions: 12
    consumer:
      concurrency: 3
  order:
    # 未支付订单超时时长与扫描间隔（Kafka 无延迟消息，改用本地定时任务）
    timeout-minutes: 30
    timeout-scan-ms: 60000
  metrics:
    # 秒杀库存对账（Redis 与 DB 库存差值）采样间隔
    stock-gap-scan-ms: 15000
# ========== 监控（阶段 3-1） ==========
# 管理端口与业务端口分离：网关只代理 8081，/actuator 不会对外暴露；Prometheus 在容器网络内抓取 9081
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 输出直方图桶，Prometheus 端可跨实例聚合出 P95 / P99（客户端计算的分位数无法聚合）
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 5s
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    # 生产/压测用 info；本地调试用 --spring.profiles.active=dev 打开 debug（含 SQL 与验证码日志）
    com.hmdp: info
